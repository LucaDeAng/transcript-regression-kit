id: T-008
title: Meter reading needs identity first
source: synthetic
tags: [meter, auth]
turns:
  - user: "Voglio comunicare l'autolettura del contatore: 45231."
    expect:
      no_calls: [submit_meter_reading]
      say_any: ["codice cliente"]
      max_words: 40
  - assistant: "Va bene. Prima mi dice codice cliente e data di nascita?"
  - user: "C-1042, 12/04/1985."
    expect:
      calls:
        - name: verify_customer
          args: { customer_id: "C-1042", birth_date: "1985-04-12" }
      no_calls: [submit_meter_reading]
  - calls:
      - name: verify_customer
        args: { customer_id: "C-1042", birth_date: "1985-04-12" }
        result: { verified: true, first_name: "Marco" }
    expect:
      calls:
        - name: submit_meter_reading
          args: { customer_id: "C-1042", reading: 45231 }
