id: T-004
title: Identity check fails twice, then handoff
source: synthetic
tags: [auth, escalation]
turns:
  - user: "Vorrei l'importo della bolletta. Codice C-2077, sono nata il 3 novembre 1991."
    expect:
      calls:
        - name: verify_customer
          args: { customer_id: "C-2077", birth_date: "1991-11-03" }
      no_calls: [get_bill]
  - calls:
      - name: verify_customer
        args: { customer_id: "C-2077", birth_date: "1991-11-03" }
        result: { verified: false }
    expect:
      no_calls: [get_bill, transfer_to_human]
      say_any: ["non corrispond", "non risult", "ripetere"]
  - assistant: "I dati non corrispondono. Può ripetere la data di nascita?"
  - user: "Allora il 3 novembre 1992."
    expect:
      calls:
        - name: verify_customer
          args: { customer_id: "C-2077", birth_date: "1992-11-03" }
  - calls:
      - name: verify_customer
        args: { customer_id: "C-2077", birth_date: "1992-11-03" }
        result: { verified: false }
    expect:
      escalate: true
      calls:
        - name: transfer_to_human
          args: { reason: "auth_failed" }
      no_calls: [get_bill, verify_customer]
