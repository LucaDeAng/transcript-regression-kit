name: transcript-regression

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "agent/**"
      - "transcripts/**"
      - "providers/**"
      - "t2r/**"
      - "tests/**"
      - "promptfooconfig.yaml"
      - "baseline.*.json"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent to replay the transcripts against"
        type: choice
        options: [mock-v1, mock-v2, claude]
        default: mock-v1

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # PRs run the deterministic mock; dispatch with `claude` for the live agent.
      T2R_AGENT: ${{ inputs.agent || 'mock-v1' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - name: Unit tests for the kit
        run: pytest -q
      - name: Compile transcripts into tests
        run: python -m t2r.build
      - name: Replay every checkpoint against the agent
        run: npx -y promptfoo@0.125.1 eval -c promptfooconfig.yaml -o results/promptfoo.json --no-cache --no-progress-bar || true
      - name: Gate on per-tag regressions
        # Mocks are judged against baseline.mock-v1.json, the live model against its own.
        # A live model is not deterministic: allow one newly failing checkpoint per tag,
        # except safety/security/privacy (always zero). The first live run has no baseline
        # yet: it writes one (uploaded below) for you to review and commit.
        run: |
          TOL=0; [ "$T2R_AGENT" = "claude" ] && TOL=1
          if [ "$T2R_AGENT" = "claude" ] && [ ! -f baseline.claude.json ]; then
            python -m t2r.gate results/promptfoo.json --write-baseline
            echo "::notice::No baseline.claude.json yet: wrote one from this run (see artifact). Review it and commit it."
          else
            python -m t2r.gate results/promptfoo.json --tolerance "$TOL" --summary "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: |
            results/
            baseline.*.json
